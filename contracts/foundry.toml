[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = []

solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20_000

# forge must be allowed to read source that lives outside the project root
# (all deps remap into ../reference). Without this, forge rejects with
# "File outside of allowed directories".
allow_paths = ["../reference"]

# The two CCT pool contracts (SzAlphaLockReleasePool, SzAlphaTokenPool) EXCEED the EIP-170 runtime
# limit at the default 20k optimizer runs (24,831 / 25,007 bytes — found in the Phase-B deploy; forge
# tests never enforce runtime size). Production pools were deployed at runs=200 (~19.8 KB). Deploy
# pools with FOUNDRY_PROFILE=pools; `script/check-pool-sizes.sh` asserts this profile still fits.
[profile.pools]
optimizer_runs = 200

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"

[rpc_endpoints]
# Base mainnet (8453) is BOTH the deploy target AND the fork/integration-test
# target. PRIMARY.
base = "${BASE_RPC_URL}"
# Optional secondary (CRE + Euler exist there; the farm/vault deps do not).
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
